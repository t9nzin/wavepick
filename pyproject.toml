[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wavepick"
version = "0.1.0"
description = "Wavelet-based peak detection for LC-MS, benchmarked against XCMS centWave"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "PyWavelets>=1.5",
]

[project.optional-dependencies]
mzml = ["pymzml>=2.5"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/wavepick"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
